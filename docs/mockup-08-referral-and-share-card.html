<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Referral and shareable result card — creator competition app</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
:root{
  --surface-0:#f7f6f2; --surface-1:#f1efe8; --surface-2:#ffffff;
  --text-primary:#171716; --text-secondary:#5f5e5a; --text-muted:#888780;
  --border:rgba(0,0,0,0.08);
  --bg-accent:#e6f1fb; --text-accent:#0c447c; --fill-accent:#378add;
  --bg-success:#eaf3de; --text-success:#27500a;
  --bg-pro:#eeedfe; --text-pro:#3c3489;
}
body{background:var(--surface-0); font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; padding:24px;}
p{margin:0;}
</style>
</head>
<body>
<div style="display:flex; gap:16px; overflow-x:auto; padding:1rem 0 1.25rem;">

<div style="flex:0 0 auto; width:220px;">
  <div style="background:var(--surface-1); border-radius:12px; padding:8px; border:0.5px solid var(--border);">
    <div style="background:var(--surface-2); border-radius:20px; border:5px solid var(--surface-0); overflow:hidden;">
      <div style="display:flex; justify-content:space-between; padding:6px 10px 2px; font-size:11px; color:var(--text-muted);"><span>9:41</span><span><i class="ti ti-wifi" aria-hidden="true"></i></span></div>
      <div style="padding:12px;">
        <p style="font-size:13px; font-weight:500; margin:0 0 8px;">Invite &amp; earn</p>
        <div style="display:flex; align-items:center; justify-content:space-between; background:var(--surface-1); border-radius:8px; padding:8px 10px; margin-bottom:10px;">
          <span style="font-size:11px; color:var(--text-secondary);">momo24.gg/r/xk92</span>
          <i class="ti ti-copy" style="font-size:14px; color:var(--text-accent);" aria-hidden="true"></i>
        </div>
        <p style="font-size:10px; color:var(--text-muted); margin:0 0 4px;">2 of 3 to next reward</p>
        <div style="height:6px; background:var(--surface-1); border-radius:4px; overflow:hidden; margin-bottom:10px;">
          <div style="width:66%; height:100%; background:var(--fill-accent);"></div>
        </div>
        <div style="display:flex; flex-direction:column; gap:5px;">
          <div style="display:flex; justify-content:space-between; align-items:center; background:var(--surface-1); border-radius:8px; padding:6px 8px;">
            <span style="font-size:11px;">@ravi.k</span>
            <span style="font-size:9px; background:var(--bg-success); color:var(--text-success); padding:2px 6px; border-radius:6px;">joined</span>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; background:var(--surface-1); border-radius:8px; padding:6px 8px;">
            <span style="font-size:11px;">@lena.p</span>
            <span style="font-size:9px; background:var(--bg-success); color:var(--text-success); padding:2px 6px; border-radius:6px;">joined</span>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; background:var(--surface-1); border-radius:8px; padding:6px 8px;">
            <span style="font-size:11px; color:var(--text-muted);">Invite pending</span>
            <span style="font-size:9px; color:var(--text-muted);">·</span>
          </div>
        </div>
        <p style="font-size:9px; color:var(--text-muted); margin:8px 0 0;">3 signups = $10 credit</p>
      </div>
    </div>
  </div>
  <p style="font-size:11px; color:var(--text-muted); text-align:center; margin:6px 0 0;">13. Invite &amp; earn</p>
</div>

<div style="flex:0 0 auto; width:170px;">
  <div style="background:var(--surface-1); border-radius:12px; padding:8px; border:0.5px solid var(--border);">
    <div style="width:154px; height:274px; border-radius:16px; background:linear-gradient(0deg, var(--bg-pro), var(--bg-accent)); position:relative; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; padding:14px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:9px; font-weight:500; color:var(--text-accent);">momo24</span>
        <span style="font-size:9px; background:var(--surface-2); color:var(--text-accent); padding:2px 6px; border-radius:6px;">Glow drop</span>
      </div>
      <div style="text-align:center;">
        <p style="font-size:15px; font-weight:500; margin:0; color:var(--text-pro);">I'm in<br/>round 2</p>
        <p style="font-size:10px; margin:4px 0 0; color:var(--text-pro);">@maya.creates</p>
      </div>
      <div style="text-align:center;">
        <p style="font-size:9px; color:var(--text-accent); margin:0;">Vote for me</p>
        <p style="font-size:8px; color:var(--text-accent); margin:2px 0 0;">momo24.gg/glowdrop</p>
      </div>
    </div>
  </div>
  <p style="font-size:11px; color:var(--text-muted); text-align:center; margin:6px 0 0;">14. Shareable result card</p>
</div>

</div>
</body>
</html>
