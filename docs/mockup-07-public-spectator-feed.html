<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Public spectator feed — creator competition app</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
:root{
  --surface-0:#f7f6f2; --surface-1:#f1efe8; --surface-2:#ffffff;
  --text-primary:#171716; --text-secondary:#5f5e5a; --text-muted:#888780;
  --border:rgba(0,0,0,0.08); --border-strong:rgba(0,0,0,0.2);
  --bg-accent:#e6f1fb; --text-accent:#0c447c; --fill-accent:#378add;
  --text-danger:#791f1f; --fill-danger:#e24b4a;
}
body{background:var(--surface-0); font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; padding:24px;}
p{margin:0;}
</style>
</head>
<body>
<div style="max-width:680px;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="width:8px; height:8px; border-radius:50%; background:var(--fill-danger);"></span>
      <p style="font-size:14px; font-weight:500; margin:0;">Live now</p>
    </div>
    <button style="background:var(--bg-accent); color:var(--text-accent); border:none; border-radius:8px; padding:7px 14px; font-size:12px; font-weight:500;">Sign up to vote</button>
  </div>

  <div style="display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px;">

    <div style="background:var(--surface-1); border-radius:12px; padding:10px;">
      <p style="font-size:11px; color:var(--text-secondary); margin:0 0 6px;">Glow drop reel · round 2</p>
      <div style="display:flex; gap:6px; margin-bottom:8px;">
        <div style="flex:1; height:70px; background:var(--surface-0); border-radius:8px; display:flex; align-items:center; justify-content:center;"><i class="ti ti-player-play" style="font-size:18px; color:var(--text-muted);" aria-hidden="true"></i></div>
        <div style="flex:1; height:70px; background:var(--surface-0); border-radius:8px; display:flex; align-items:center; justify-content:center;"><i class="ti ti-player-play" style="font-size:18px; color:var(--text-muted);" aria-hidden="true"></i></div>
      </div>
      <div style="display:flex; height:8px; border-radius:4px; overflow:hidden; margin-bottom:4px;">
        <div style="width:58%; background:var(--fill-accent);"></div>
        <div style="width:42%; background:var(--border-strong);"></div>
      </div>
      <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--text-muted);">
        <span>58%</span>
        <span><i class="ti ti-clock" style="font-size:11px; vertical-align:-1px;" aria-hidden="true"></i> 3h left</span>
        <span>42%</span>
      </div>
    </div>

    <div style="background:var(--surface-1); border-radius:12px; padding:10px;">
      <p style="font-size:11px; color:var(--text-secondary); margin:0 0 6px;">Sneaker unboxing · round 1</p>
      <div style="display:flex; gap:6px; margin-bottom:8px;">
        <div style="flex:1; height:70px; background:var(--surface-0); border-radius:8px; display:flex; align-items:center; justify-content:center;"><i class="ti ti-player-play" style="font-size:18px; color:var(--text-muted);" aria-hidden="true"></i></div>
        <div style="flex:1; height:70px; background:var(--surface-0); border-radius:8px; display:flex; align-items:center; justify-content:center;"><i class="ti ti-player-play" style="font-size:18px; color:var(--text-muted);" aria-hidden="true"></i></div>
      </div>
      <div style="display:flex; height:8px; border-radius:4px; overflow:hidden; margin-bottom:4px;">
        <div style="width:33%; background:var(--fill-accent);"></div>
        <div style="width:67%; background:var(--border-strong);"></div>
      </div>
      <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--text-muted);">
        <span>33%</span>
        <span><i class="ti ti-clock" style="font-size:11px; vertical-align:-1px;" aria-hidden="true"></i> 6h left</span>
        <span>67%</span>
      </div>
    </div>

    <div style="background:var(--surface-1); border-radius:12px; padding:10px;">
      <p style="font-size:11px; color:var(--text-secondary); margin:0 0 6px;">Fit check challenge · round 1</p>
      <div style="display:flex; gap:6px; margin-bottom:8px;">
        <div style="flex:1; height:70px; background:var(--surface-0); border-radius:8px; display:flex; align-items:center; justify-content:center;"><i class="ti ti-player-play" style="font-size:18px; color:var(--text-muted);" aria-hidden="true"></i></div>
        <div style="flex:1; height:70px; background:var(--surface-0); border-radius:8px; display:flex; align-items:center; justify-content:center;"><i class="ti ti-player-play" style="font-size:18px; color:var(--text-muted);" aria-hidden="true"></i></div>
      </div>
      <div style="display:flex; height:8px; border-radius:4px; overflow:hidden; margin-bottom:4px;">
        <div style="width:50%; background:var(--fill-accent);"></div>
        <div style="width:50%; background:var(--border-strong);"></div>
      </div>
      <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--text-muted);">
        <span>50%</span>
        <span><i class="ti ti-clock" style="font-size:11px; vertical-align:-1px;" aria-hidden="true"></i> 45m left</span>
        <span>50%</span>
      </div>
    </div>

    <div style="background:var(--surface-1); border-radius:12px; padding:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:6px;">
      <i class="ti ti-user-plus" style="font-size:22px; color:var(--text-accent);" aria-hidden="true"></i>
      <p style="font-size:11px; margin:0;">Sign up to vote and see who wins</p>
      <button style="background:var(--bg-accent); color:var(--text-accent); border:none; border-radius:8px; padding:6px 14px; font-size:11px; font-weight:500;">Join free</button>
    </div>

  </div>
</div>
</body>
</html>
