<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI tools for brands and creators — creator competition app</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
:root{
  --surface-0:#f7f6f2; --surface-1:#f1efe8; --surface-2:#ffffff;
  --text-primary:#171716; --text-secondary:#5f5e5a; --text-muted:#888780;
  --border:rgba(0,0,0,0.08); --border-strong:rgba(0,0,0,0.2);
  --bg-accent:#e6f1fb; --text-accent:#0c447c;
  --bg-success:#eaf3de; --text-success:#27500a;
  --bg-pro:#eeedfe; --text-pro:#3c3489;
  --fill-secondary:transparent;
}
body{background:var(--surface-0); font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; padding:24px;}
p{margin:0;}
</style>
</head>
<body>
<div style="display:flex; gap:16px; overflow-x:auto; padding:1rem 0 1.25rem;">

<div style="flex:0 0 auto; width:220px;">
  <div style="background:var(--surface-1); border-radius:12px; padding:8px; border:0.5px solid var(--border);">
    <div style="background:var(--surface-2); border-radius:20px; border:5px solid var(--surface-0); overflow:hidden;">
      <div style="display:flex; justify-content:space-between; padding:6px 10px 2px; font-size:11px; color:var(--text-muted);"><span>9:41</span><span><i class="ti ti-wifi" aria-hidden="true"></i></span></div>
      <div style="padding:10px 12px 14px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <p style="font-size:13px; font-weight:500; margin:0;">Generate visuals</p>
          <span style="font-size:9px; background:var(--bg-pro); color:var(--text-pro); padding:2px 7px; border-radius:6px;"><i class="ti ti-sparkles" style="font-size:10px; vertical-align:-1px;" aria-hidden="true"></i> 12 credits</span>
        </div>
        <div style="background:var(--surface-1); border-radius:8px; padding:8px 10px; margin-bottom:8px;">
          <p style="font-size:10px; color:var(--text-muted); margin:0 0 3px;">Prompt</p>
          <p style="font-size:11px; margin:0;">Glow serum bottle on marble, soft morning light</p>
        </div>
        <div style="display:flex; gap:6px; margin-bottom:8px;">
          <span style="font-size:10px; background:var(--bg-accent); color:var(--text-accent); padding:4px 8px; border-radius:14px;">Studio</span>
          <span style="font-size:10px; background:var(--surface-1); color:var(--text-secondary); padding:4px 8px; border-radius:14px;">Lifestyle</span>
          <span style="font-size:10px; background:var(--surface-1); color:var(--text-secondary); padding:4px 8px; border-radius:14px;">UGC style</span>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:10px;">
          <div style="height:56px; background:var(--surface-1); border-radius:8px; display:flex; align-items:center; justify-content:center;"><i class="ti ti-photo" style="font-size:16px; color:var(--text-muted);" aria-hidden="true"></i></div>
          <div style="height:56px; background:var(--surface-1); border-radius:8px; display:flex; align-items:center; justify-content:center;"><i class="ti ti-photo" style="font-size:16px; color:var(--text-muted);" aria-hidden="true"></i></div>
          <div style="height:56px; background:var(--surface-1); border-radius:8px; display:flex; align-items:center; justify-content:center;"><i class="ti ti-photo" style="font-size:16px; color:var(--text-muted);" aria-hidden="true"></i></div>
          <div style="height:56px; background:var(--surface-1); border-radius:8px; display:flex; align-items:center; justify-content:center;"><i class="ti ti-photo" style="font-size:16px; color:var(--text-muted);" aria-hidden="true"></i></div>
        </div>
        <button style="width:100%; background:var(--fill-secondary); border:0.5px solid var(--border-strong); border-radius:8px; padding:8px; font-size:12px; font-weight:500;">Use in campaign</button>
      </div>
    </div>
  </div>
  <p style="font-size:11px; color:var(--text-muted); text-align:center; margin:6px 0 0;">11. Brand AI asset generator</p>
</div>

<div style="flex:0 0 auto; width:220px;">
  <div style="background:var(--surface-1); border-radius:12px; padding:8px; border:0.5px solid var(--border);">
    <div style="background:var(--surface-2); border-radius:20px; border:5px solid var(--surface-0); overflow:hidden;">
      <div style="display:flex; justify-content:space-between; padding:6px 10px 2px; font-size:11px; color:var(--text-muted);"><span>9:41</span><span><i class="ti ti-wifi" aria-hidden="true"></i></span></div>
      <div style="padding:10px 12px 14px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <p style="font-size:13px; font-weight:500; margin:0;">AI edit clip</p>
          <span style="font-size:9px; background:var(--bg-pro); color:var(--text-pro); padding:2px 7px; border-radius:6px;"><i class="ti ti-sparkles" style="font-size:10px; vertical-align:-1px;" aria-hidden="true"></i> 5 credits</span>
        </div>
        <div style="height:110px; background:var(--surface-1); border-radius:10px; display:flex; align-items:center; justify-content:center; margin-bottom:8px;">
          <i class="ti ti-player-play" style="font-size:22px; color:var(--text-muted);" aria-hidden="true"></i>
        </div>
        <div style="display:flex; flex-direction:column; gap:5px; margin-bottom:10px;">
          <div style="display:flex; justify-content:space-between; align-items:center; background:var(--surface-1); border-radius:8px; padding:6px 8px;">
            <span style="font-size:11px;"><i class="ti ti-turtle" style="font-size:13px; vertical-align:-2px;" aria-hidden="true"></i> Auto captions</span>
            <i class="ti ti-check" style="font-size:13px; color:var(--text-success);" aria-hidden="true"></i>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; background:var(--surface-1); border-radius:8px; padding:6px 8px;">
            <span style="font-size:11px;"><i class="ti ti-wand" style="font-size:13px; vertical-align:-2px;" aria-hidden="true"></i> Enhance quality</span>
            <i class="ti ti-check" style="font-size:13px; color:var(--text-success);" aria-hidden="true"></i>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; background:var(--surface-1); border-radius:8px; padding:6px 8px;">
            <span style="font-size:11px;"><i class="ti ti-music" style="font-size:13px; vertical-align:-2px;" aria-hidden="true"></i> Trending audio</span>
            <span style="font-size:9px; color:var(--text-muted);">off</span>
          </div>
        </div>
        <button style="width:100%; background:var(--fill-secondary); border:0.5px solid var(--border-strong); border-radius:8px; padding:8px; font-size:12px; font-weight:500;">Apply &amp; continue</button>
      </div>
    </div>
  </div>
  <p style="font-size:11px; color:var(--text-muted); text-align:center; margin:6px 0 0;">12. Creator AI editor</p>
</div>

</div>
</body>
</html>
