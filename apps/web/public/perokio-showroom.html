<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEROKIO — product showroom</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
:root{
  --bg:#08080a; --panel:#101013; --surf:#17171b; --surf2:#1f1f25; --line:rgba(255,255,255,.09);
  --line2:rgba(255,255,255,.2); --tx:#f6f6f4; --dim:#a5a59f; --dim2:#87877f;
  --money:#c8f751; --money-d:#1e2a08; --hot:#ff4f3b; --hot-d:#2d0d09;
  --gold:#ffbf29; --gold-d:#2b1e04; --vio:#8f7dff; --vio-d:#171233; --ok:#3ddc8b; --ok-d:#0a2418;
  --r:12px;
}
body{margin:0; background:var(--bg); color:var(--tx);
  font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif; font-variant-numeric:tabular-nums;}
p,h1,h2,h3{margin:0;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
.num{font-variant-numeric:tabular-nums; letter-spacing:-.02em;}

.wrap{display:flex; gap:22px; padding:20px; align-items:flex-start; max-width:1500px; margin:0 auto;}
.idx{width:212px; flex:0 0 auto; position:sticky; top:20px; max-height:94vh; overflow:auto;}
.idx::-webkit-scrollbar{width:5px;} .idx::-webkit-scrollbar-thumb{background:var(--surf2); border-radius:3px;}
.idx h1{font-size:15px; letter-spacing:.16em; font-weight:600; margin-bottom:2px;}
.idx .sub{font-size:11px; color:var(--dim2); margin-bottom:14px;}
.grp{font-size:9.5px; letter-spacing:.13em; color:var(--dim2); text-transform:uppercase; margin:14px 0 5px;}
.ni{display:flex; gap:7px; align-items:center; padding:5px 8px; border-radius:7px; font-size:11.5px;
  color:var(--dim); cursor:pointer; line-height:1.3;}
.ni:hover{background:var(--surf); color:var(--tx);}
.ni.on{background:var(--surf2); color:var(--tx);}
.ni b{color:var(--dim2); font-weight:500; font-size:10px; width:15px; flex:0 0 auto;}
.ni.on b{color:var(--money);}

.stage{flex:1; display:flex; flex-direction:column; align-items:center; gap:12px;}
.bar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center;}
.btn{font-size:11.5px; padding:7px 13px; border-radius:20px; background:var(--surf);
  border:.5px solid var(--line); color:var(--dim);}
.btn:hover{color:var(--tx); border-color:var(--line2);}
.btn.on{background:var(--money); color:#0b1300; border-color:var(--money); font-weight:600;}

.phone{width:372px; height:788px; background:var(--panel); border-radius:38px; padding:9px;
  border:1px solid var(--line); flex:0 0 auto;}
.vp{width:100%; height:100%; background:var(--bg); border-radius:30px; overflow-y:auto; overflow-x:hidden;
  position:relative; border:.5px solid var(--line);}
.vp::-webkit-scrollbar{width:0;}
.cap{font-size:11px; color:var(--dim2); text-align:center;}
.voice-card{width:min(100%,760px);display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 18px;border:1px solid rgba(200,247,81,.24);border-radius:16px;background:linear-gradient(135deg,rgba(30,42,8,.82),rgba(16,16,19,.96));box-shadow:0 18px 50px rgba(0,0,0,.18);}
.voice-card strong{display:block;margin-top:4px;font-size:16px;letter-spacing:-.025em;color:var(--tx);}
.voice-card p{max-width:480px;margin-top:5px;font-size:11px;line-height:1.5;color:var(--dim);}
.voice-label{display:block;font-size:9px;letter-spacing:.14em;color:var(--money);font-weight:700;}
.voice-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:245px;}
.voice-chip{padding:7px 9px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--dim);font-size:10px;white-space:nowrap;}
@media(max-width:760px){.voice-card{align-items:flex-start;flex-direction:column;gap:12px}.voice-actions{justify-content:flex-start;max-width:none}}


.sb{display:flex; justify-content:space-between; padding:11px 18px 4px; font-size:11px; color:var(--dim2);}
.pad{padding:4px 18px 26px;}
.tbar{position:sticky; bottom:0; display:flex; justify-content:space-around; padding:11px 0 15px;
  background:linear-gradient(to top,var(--bg) 68%,transparent); border-top:.5px solid var(--line);}
.tbar i{font-size:19px; color:var(--dim2);} .tbar i.on{color:var(--money);}

.h{font-size:19px; font-weight:600; letter-spacing:-.02em;}
.eyebrow{font-size:9.5px; letter-spacing:.15em; text-transform:uppercase; color:var(--dim2);}
.money{font-size:46px; font-weight:700; letter-spacing:-.045em; line-height:1; color:var(--money);}
.money-sm{font-size:26px; font-weight:700; letter-spacing:-.04em; color:var(--money);}
.card{background:var(--surf); border-radius:var(--r); border:.5px solid var(--line); padding:13px;}
.row{background:var(--surf); border-radius:10px; padding:10px 12px; display:flex; align-items:center; gap:10px;}
.pill{font-size:9.5px; padding:3px 8px; border-radius:20px; font-weight:600; letter-spacing:.02em; display:inline-block;}
.p-money{background:var(--money-d); color:var(--money);}
.p-hot{background:var(--hot-d); color:var(--hot);}
.p-gold{background:var(--gold-d); color:var(--gold);}
.p-vio{background:var(--vio-d); color:var(--vio);}
.p-ok{background:var(--ok-d); color:var(--ok);}
.p-dim{background:var(--surf2); color:var(--dim);}
.cta{width:100%; padding:14px; border-radius:11px; background:var(--money); color:#0b1300;
  font-size:14px; font-weight:700; letter-spacing:-.01em;}
.cta:active{transform:scale(.985);}
.cta.ghost{background:transparent; border:1px solid var(--line2); color:var(--tx); font-weight:600;}
.cta.hot{background:var(--hot); color:#fff;}
.cta:disabled{background:var(--surf2); color:var(--dim2); cursor:not-allowed;}
.clock{font-size:11.5px; color:var(--hot); font-weight:600;}
.bar-t{height:5px; background:var(--surf2); border-radius:3px; overflow:hidden;}
.bar-f{height:100%; background:var(--money); border-radius:3px; transition:width .35s;}
.av{border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; flex:0 0 auto;}
.thumb{background:linear-gradient(145deg,var(--surf2),var(--surf)); border-radius:9px;
  display:flex; align-items:center; justify-content:center; color:var(--dim2);}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px;}
.stat{background:var(--surf); border-radius:10px; padding:10px;}
.stat .v{font-size:17px; font-weight:700; letter-spacing:-.03em;}
.stat .l{font-size:9.5px; color:var(--dim2); margin-top:1px;}
.sep{height:.5px; background:var(--line); margin:13px 0;}
.note{font-size:10px; color:var(--dim2); line-height:1.5;}
.tabs{display:flex; gap:16px; border-bottom:.5px solid var(--line);}
.tab{font-size:12px; color:var(--dim2); padding-bottom:8px; cursor:pointer;}
.tab.on{color:var(--tx); font-weight:600; box-shadow:inset 0 -1.5px 0 var(--money);}
.vs{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:var(--bg);
  border:1px solid var(--line2); width:30px; height:30px; border-radius:50%; display:flex;
  align-items:center; justify-content:center; font-size:10px; font-weight:700; color:var(--dim);}
.gridview{display:flex; flex-wrap:wrap; gap:14px; justify-content:center; padding:0 8px 40px;}
.gcell{width:250px;}
.gframe{width:250px; height:530px; background:var(--panel); border-radius:20px; padding:5px; border:1px solid var(--line);}
.gvp{width:100%; height:100%; background:var(--bg); border-radius:16px; overflow:hidden; position:relative;}
.gvp .inner{width:372px; transform:scale(.645); transform-origin:top left; height:815px; overflow:hidden;}
.gcap{font-size:10.5px; color:var(--dim2); text-align:center; margin-top:6px;}
.gcap b{color:var(--dim); font-weight:600;}
@media print{ .idx,.bar{display:none;} body{background:#fff;} }
</style>
</head>
<body>
<div class="wrap">
  <nav class="idx" id="idx"></nav>
    <div class="stage">
    <section class="voice-card" aria-label="Perokio brand voice">
      <div><span class="voice-label">BRAND VOICE</span><strong>Where stories become opportunities.</strong><p>Warm, ambitious and proof-led. We invite people in, make stakes visible and never promise what the product cannot verify.</p></div>
      <div class="voice-actions"><span class="voice-chip">Start your story</span><span class="voice-chip">Rally this story</span><span class="voice-chip">Make the call</span></div>
    </section>
    <div class="bar">
      <button class="btn on" id="mPhone">Prototype</button>
      <button class="btn" id="mGrid">All 46 screens</button>
      <button class="btn" id="reset"><i class="ti ti-refresh"></i> Reset state</button>
    </div>
    <div id="stage"></div>
  </div>
</div>

<script>
const S = {
  screen:'splash', tab:'campaigns', votes:0, need:8, deck:0, unlocked:false,
  rally:127, copied:false, submitted:false, wizard:1, mode:'phone',
  watched:0, check:false, preds:2, predLocked:true
};
const DECK = [
  ['Teaser A','Teaser B'],['Teaser C','Teaser D'],['Teaser E','Teaser F'],['Teaser G','Teaser H'],
  ['Teaser I','Teaser J'],['Teaser K','Teaser L'],['Teaser M','Teaser N'],['Teaser O','Teaser P']
];
const END = Date.now() + 2*3600*1000 + 14*60*1000;
function cd(){ let d=Math.max(0,END-Date.now()), h=Math.floor(d/3.6e6), m=Math.floor(d%3.6e6/6e4), s=Math.floor(d%6e4/1e3);
  return `${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`; }

const sb = () => `<div class="sb"><span>9:41</span><span><i class="ti ti-wifi"></i></span></div>`;
const tbar = a => `<div class="tbar">
  ${['home','compass','trophy','wallet','user'].map((i,n)=>`<i class="ti ti-${i} ${n===a?'on':''}" onclick="go('${['home','discovery','bracket','wallet','profile'][n]}')"></i>`).join('')}
</div>`;
const av = (t,c,s)=>`<div class="av" style="width:${s}px;height:${s}px;background:var(--${c}-d);color:var(--${c});font-size:${s*.36}px">${t}</div>`;

const SCREENS = {

splash:{g:'Creator',n:'Splash · role pick',r:()=>`${sb()}<div class="pad" style="display:flex;flex-direction:column;height:735px">
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
    <p class="eyebrow" style="margin-bottom:14px">Live in Tunis</p>
    <h1 style="font-size:44px;font-weight:700;letter-spacing:-.045em;line-height:.98">Where stories<br>become<br>opportunities.</h1>
    <p style="font-size:13.5px;color:var(--dim);margin-top:14px;line-height:1.5">32 creators enter. Peers vote blind.<br>One takes the pool. Finalists still get paid.</p>
    <div class="card" style="margin-top:22px;display:flex;align-items:center;gap:12px">
      <div><p class="eyebrow">Live pool right now</p><p class="money num">$5,000</p></div>
      <div style="margin-left:auto;text-align:right"><p class="clock num" id="cd1">${cd()}</p><p class="note">until round 2 closes</p></div>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:9px">
    <button class="cta" onclick="go('verify')">I'm a creator</button>
    <button class="cta ghost" onclick="go('bhome')">I'm a brand</button>
    <button class="cta ghost" style="border:none;color:var(--dim)" onclick="go('feed')">Just watching →</button>
  </div></div>`},

verify:{g:'Creator',n:'Verify · one human one vote',r:()=>`${sb()}<div class="pad">
  <p class="eyebrow" style="margin-bottom:10px">Step 2 of 2</p>
  <h2 class="h">Verify your number</h2>
  <p class="note" style="margin:7px 0 18px">One human, one vote. This is what makes winning here mean something — and it's why brands trust the result.</p>
  <div class="card" style="margin-bottom:10px"><p class="note">Phone</p><p style="font-size:16px;font-weight:600;margin-top:3px">+216 •• ••• 402</p></div>
  <div style="display:flex;gap:7px;margin-bottom:16px">
    ${[4,9,2,7,'',''].map(d=>`<div style="flex:1;aspect-ratio:1;background:var(--surf);border:.5px solid ${d===''?'var(--line)':'var(--line2)'};border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700">${d}</div>`).join('')}
  </div>
  <div class="card" style="background:var(--vio-d);border-color:transparent;margin-bottom:16px">
    <p style="font-size:11.5px;color:var(--vio);font-weight:600"><i class="ti ti-shield-check"></i> Verified voter</p>
    <p class="note" style="color:var(--vio);opacity:.75;margin-top:3px">Unverified accounts can watch everything. They just can't vote or win.</p>
  </div>
  <button class="cta" onclick="go('home')">Verify and enter</button>
  <p class="note" style="text-align:center;margin-top:12px">Entry is always free. Winners are decided by votes on the work, never by payment.</p>
</div>`},

home:{g:'Creator',n:'Home · stakes and streak',r:()=>`${sb()}<div class="pad">
  <div style="display:flex;align-items:center;margin-bottom:16px">
    <div><p class="eyebrow">Tunis</p><h2 class="h">12 challenges near you</h2></div>
    <div style="margin-left:auto;text-align:center;background:var(--surf);border-radius:10px;padding:7px 10px">
      <p style="font-size:17px;font-weight:700;color:var(--gold)" class="num">6</p><p class="note">day streak</p></div>
  </div>
  <div class="card" style="border-color:var(--money);background:linear-gradient(160deg,var(--money-d),var(--surf));margin-bottom:11px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div><p class="eyebrow" style="color:var(--money);opacity:.8">You're in · round 2 of 3</p>
      <p class="money num" style="margin-top:5px">$5,000</p>
      <p style="font-size:12px;color:var(--dim);margin-top:5px">Glow drop reel · Glow Co</p></div>
      ${av('GC','money',38)}
    </div>
    <div class="sep" style="margin:12px 0"></div>
    <div style="display:flex;align-items:center;gap:9px">
      <div style="flex:1"><p class="clock num" id="cd2">${cd()}</p><p class="note">left to rally your voters</p></div>
      <button class="cta" style="width:auto;padding:9px 15px;font-size:12px" onclick="go('rally')">Rally →</button>
    </div>
  </div>
  <div class="card" style="background:var(--hot-d);border-color:transparent;margin-bottom:11px;display:flex;align-items:center;gap:11px">
    <i class="ti ti-lock" style="font-size:21px;color:var(--hot)"></i>
    <div style="flex:1"><p style="font-size:12.5px;font-weight:600;color:var(--hot)">Your round 1 result is locked</p>
      <p class="note" style="color:var(--hot);opacity:.8">Vote on ${S.need-S.votes} more teasers to unlock it</p></div>
    <button class="cta hot" style="width:auto;padding:8px 13px;font-size:11.5px" onclick="go('deck')">Vote</button>
  </div>
  <p class="eyebrow" style="margin:16px 0 8px">Closing soon</p>
  ${[['Sneaker unboxing','Nova','$1,200','5h','money'],['Fit check','Fitted','$900','12h','gold']].map(c=>`
  <div class="row" style="margin-bottom:8px" onclick="go('brief')">
    ${av(c[1].slice(0,2).toUpperCase(),c[4],32)}
    <div style="flex:1"><p style="font-size:12.5px;font-weight:600">${c[0]}</p><p class="note">${c[1]} · 64 entries</p></div>
    <div style="text-align:right"><p class="money-sm num">${c[2]}</p><p class="clock" style="font-size:10px">${c[3]} left</p></div>
  </div>`).join('')}
</div>${tbar(0)}`},

discovery:{g:'Creator',n:'Discovery · 3 tabs',r:()=>{
  const t=S.tab;
  const tabs=`<div class="tabs" style="margin-bottom:12px">${[['campaigns','Campaigns'],['creators','Creators'],['brands','Brands']].map(x=>
    `<div class="tab ${t===x[0]?'on':''}" onclick="S.tab='${x[0]}';render()">${x[1]}</div>`).join('')}</div>`;
  let body='';
  if(t==='campaigns') body=[['Glow drop reel','Glow Co','$5,000','128','2d','money',1],['Sneaker unboxing','Nova','$1,200','64','5d','gold',1],['Fit check','Fitted','$900','210','12h','hot',0]]
    .map(c=>`<div class="card" style="margin-bottom:9px" onclick="go('brief')">
      <div class="thumb" style="height:88px;margin-bottom:9px"><i class="ti ti-player-play" style="font-size:24px"></i></div>
      <div style="display:flex;align-items:center;gap:8px">${av(c[1].slice(0,2).toUpperCase(),c[5],26)}
        <div style="flex:1"><p style="font-size:12.5px;font-weight:600">${c[0]} ${c[6]?'<i class="ti ti-rosette-discount-check" style="color:var(--vio);font-size:12px"></i>':''}</p>
        <p class="note">${c[3]} entries · ${c[4]} left</p></div>
        <p class="money-sm num">${c[2]}</p></div>
      <p class="note" style="margin-top:8px;color:${c[6]?'var(--ok)':'var(--dim2)'}">
        <i class="ti ti-${c[6]?'shield-check':'sparkles'}"></i> ${c[6]?c[1]+' · 100% paid on time':'First campaign · prize funded in escrow'}</p>
    </div>`).join('');
  if(t==='creators') body=`<div style="display:flex;gap:6px;margin-bottom:11px">
    <span class="pill p-money">Top ranked</span><span class="pill p-dim">Near me</span><span class="pill p-dim">Rising</span></div>`+
    [['maya.creates','Lagos · beauty','34','71%','4.8','vio','Diamond'],['theo.vids','Jakarta · tech','29','64%','4.6','vio','Diamond'],['ava.creates','Tunis · fashion','21','52%','4.4','gold','Gold']]
    .map((c,i)=>`<div class="card" style="margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:9px">
        <span class="note" style="width:9px">${i+1}</span>${av(c[0].slice(0,2).toUpperCase(),c[5],30)}
        <div style="flex:1"><p style="font-size:12.5px;font-weight:600">@${c[0]}</p><p class="note">${c[1]}</p></div>
        <span class="pill p-${c[5]}">${c[6]}</span></div>
      <div class="grid3">${[[c[2],'Wins'],[c[3],'Finals rate'],[c[4],'Brand score']].map(s=>
        `<div class="stat" style="background:var(--surf2);text-align:center"><p class="v num">${s[0]}</p><p class="l">${s[1]}</p></div>`).join('')}</div>
    </div>`).join('');
  if(t==='brands') body=[['Glow Co','Beauty · 2 live','18','$41k','$2.3k','4.9','100%','money',1],['Nova','Footwear · 1 live','9','$14k','$1.5k','4.5','96%','gold',1]]
    .map(c=>`<div class="card" style="margin-bottom:9px" onclick="go('trust')">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:9px">${av(c[0].slice(0,2).toUpperCase(),c[7],30)}
        <div style="flex:1"><p style="font-size:12.5px;font-weight:600">${c[0]} <i class="ti ti-rosette-discount-check" style="color:var(--vio);font-size:12px"></i></p><p class="note">${c[1]}</p></div>
        <span class="pill p-ok">${c[5]}</span></div>
      <div class="grid3">${[[c[2],'Campaigns'],[c[3],'Paid out'],[c[4],'Avg prize']].map(s=>
        `<div class="stat" style="background:var(--surf2);text-align:center"><p class="v num">${s[0]}</p><p class="l">${s[1]}</p></div>`).join('')}</div>
      <p class="note" style="margin-top:8px;color:var(--ok)"><i class="ti ti-shield-check"></i> ${c[6]} paid on time</p>
    </div>`).join('')+
    `<div class="card" style="opacity:.75"><div style="display:flex;align-items:center;gap:9px">${av('FT','hot',30)}
      <div style="flex:1"><p style="font-size:12.5px;font-weight:600">Fitted</p><p class="note">Fashion · 1 live</p></div>
      <span class="pill p-dim">New</span></div>
      <p class="note" style="margin-top:8px"><i class="ti ti-sparkles"></i> First campaign · $900 already funded in escrow</p></div>`;
  return `${sb()}<div class="pad"><h2 class="h" style="margin-bottom:12px">Discover</h2>
    <div class="row" style="margin-bottom:12px;padding:9px 12px"><i class="ti ti-search" style="color:var(--dim2)"></i>
      <span class="note">Search ${t}</span></div>${tabs}${body}</div>${tbar(1)}`}},

trust:{g:'Creator',n:'Trust ledger · brand profile',r:()=>`${sb()}<div class="pad">
  <div style="display:flex;align-items:center;gap:11px;margin-bottom:16px">
    <i class="ti ti-arrow-left" style="font-size:18px;color:var(--dim)" onclick="go('discovery')"></i>
    ${av('GC','money',40)}
    <div><p style="font-size:15px;font-weight:700">Glow Co <i class="ti ti-rosette-discount-check" style="color:var(--vio);font-size:13px"></i></p>
    <p class="note">Beauty · Tunis, TN</p></div>
  </div>
  <div class="card" style="background:var(--ok-d);border-color:transparent;margin-bottom:11px;text-align:center">
    <p class="eyebrow" style="color:var(--ok);opacity:.8">Stripe-verified payout history</p>
    <p style="font-size:38px;font-weight:700;color:var(--ok);letter-spacing:-.04em;margin-top:4px" class="num">100%</p>
    <p style="font-size:12px;color:var(--ok);opacity:.85">18 of 18 campaigns paid on time</p>
  </div>
  <div class="grid2" style="margin-bottom:11px">

dispute:{g:'Creator',n:'Dispute · appeal an elimination',r:()=>`${sb()}<div class="pad">

};

const ORDER = Object.keys(SCREENS);
function go(k){ S.screen=k; if(k==='deck'){S.watched=0;} render(); window.scrollTo({top:0,behavior:'smooth'}); }
function vote(){ if(S.watched<3) return;
  S.votes=Math.min(S.need,S.votes+1); S.deck++; S.watched=0;
  S.check = (S.votes===5);
  render(); }

function nav(){
  let out='', last='';
  ORDER.forEach((k,i)=>{
    const s=SCREENS[k];
    if(s.g!==last){ out+=`<div class="grp">${s.g}</div>`; last=s.g; }
    out+=`<div class="ni ${S.screen===k&&S.mode==='phone'?'on':''}" onclick="go('${k}')"><b>${i+1}</b>${s.n}</div>`;
  });
  return `<h1>PEROKIO</h1><p class="sub">${ORDER.length} screens · interactive</p>`+out;
}

function render(){
  document.getElementById('idx').innerHTML = nav();
  const st = document.getElementById('stage');
  if(S.mode==='grid'){
    st.innerHTML = `<div class="gridview">${ORDER.map((k,i)=>`
      <div class="gcell"><div class="gframe"><div class="gvp"><div class="inner">${SCREENS[k].r()}</div></div></div>
      <p class="gcap"><b>${i+1}.</b> ${SCREENS[k].n}</p></div>`).join('')}</div>`;
  } else {
    st.innerHTML = `<div class="phone"><div class="vp">${SCREENS[S.screen].r()}</div></div>
      <p class="cap">${ORDER.indexOf(S.screen)+1} / ${ORDER.length} · ${SCREENS[S.screen].n}</p>`;
  }
}

document.getElementById('mPhone').onclick=()=>{S.mode='phone';
  document.getElementById('mPhone').classList.add('on');document.getElementById('mGrid').classList.remove('on');render();};
document.getElementById('mGrid').onclick=()=>{S.mode='grid';
  document.getElementById('mGrid').classList.add('on');document.getElementById('mPhone').classList.remove('on');render();};
document.getElementById('reset').onclick=()=>{S.votes=0;S.deck=0;S.unlocked=false;S.submitted=false;S.rally=127;S.copied=false;S.tab='campaigns';go('splash');};

setInterval(()=>{ if(S.mode!=='phone') return;
  ['cd1','cd2','cd3'].forEach(id=>{const e=document.getElementById(id); if(e) e.textContent=cd();});
  if(S.screen==='deck' && S.watched<3 && S.votes<S.need){ S.watched++; render(); } },1000);

render();
</script>
